<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>清洗小工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/site.css">
<script src="../assets/js/common.js"></script>
</head>
<body data-root="../" data-lab="s2/tools"
      data-lead="三個最常用的轉換：民國日期與學年學期、學生手打的學號、四種寫法的班級。左邊貼上資料（一行一筆），右邊立刻看結果，下面是對應的 Power Query M 公式。">
<main class="wrap">
  <div class="seg" id="tabs" style="margin-bottom:14px">
    <button data-t="date" aria-pressed="true">民國日期 → 西元與學期</button>
    <button data-t="sid" aria-pressed="false">學號清洗</button>
    <button data-t="cls" aria-pressed="false">班級寫法統一</button>
  </div>
  <div class="grid g3">
    <div class="card stack">
      <label class="field" id="inLabel"></label>
      <textarea id="input" style="min-height:260px;font-family:var(--mono)"></textarea>
      <div class="row"><button class="btn sm ghost" id="sample">放入範例</button><button class="btn sm ghost" id="copyOut">複製結果</button></div>
    </div>
    <div class="card" style="grid-column: span 2">
      <div class="row"><h3 style="margin:0">結果</h3><span class="spacer"></span><span class="small" id="sum"></span></div>
      <div class="tablewrap" id="out" style="margin-top:8px;max-height:330px"></div>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <h3 id="mTitle">Power Query M 公式</h3>
    <p class="small muted" id="mNote"></p>
    <pre id="mcode"></pre>
    <div class="row"><button class="btn sm ghost" id="copyM">複製 M 公式</button></div>
  </div>
</main>
<script>
const TOOLS = {
  date: {
    label: "民國日期（例：113/09/02 或 1130902）",
    sample: "113/09/02\n113/10/31\n114/01/15\n114/02/03\n113/07/31\n1130815\n113.12.25",
    cols: ["原始", "西元日期", "學年學期", "說明"],
    run: (s) => {
      const t = s.trim(); let m = t.match(/^(\d{2,3})[\/.\-](\d{1,2})[\/.\-](\d{1,2})$/) || t.match(/^(\d{3})(\d{2})(\d{2})$/);
      if (!m) return [s, "", "", "看不懂的格式"];
      const y = +m[1] + 1911, mo = +m[2], d = +m[3], roc = +m[1];
      const term = mo >= 8 ? `${roc}-1` : mo === 1 ? `${roc - 1}-1` : `${roc - 1}-2`;
      return [s, `${y}/${mo}/${d}`, term, mo === 1 ? "1 月仍屬上一學年第 1 學期" : mo >= 8 ? "8 月起為新學年第 1 學期" : "2–7 月為第 2 學期"];
    },
    note: "學年學期依學期對照表：8/1–隔年 1/31 為第 1 學期，2/1–7/31 為第 2 學期。民國年 ＋ 1911 ＝ 西元年。",
    m: `西元日期 = Table.AddColumn(上一步, "西元日期", each #date(
    Number.From(Text.BeforeDelimiter([日期], "/")) + 1911,
    Number.From(Text.BetweenDelimiters([日期], "/", "/")),
    Number.From(Text.AfterDelimiter([日期], "/", 1))), type date),
學年學期 = Table.AddColumn(西元日期, "學年學期", each
    let y = Date.Year([西元日期]) - 1911, m = Date.Month([西元日期])
    in if m >= 8 then Text.From(y) & "-1"
       else if m = 1 then Text.From(y - 1) & "-1"
       else Text.From(y - 1) & "-2", type text)`,
  },
  sid: {
    label: "學生手打的學號（例：表單回應）",
    sample: "111092\nS111176\n１１１０３１\n111-045\n 111130 \n11107\ns111020\n111 008",
    cols: ["原始", "轉半形", "只留數字", "結果", "狀態"],
    run: (s) => {
      const h = s.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 65248));
      const d = h.replace(/\D/g, "");
      const ok = /^\d{6}$/.test(d);
      return [s, h, d, ok ? d : "", ok ? (d === s ? "原本就正確" : "已修正") : `剩 ${d.length} 碼：打錯，需人工確認`];
    },
    note: "順序：先全形轉半形，再只留數字，最後檢查是否為 6 碼。打錯的（少一碼）電腦救不回來，用「左方反向合併」把它們挑出來請人確認。",
    m: `半形 = Table.TransformColumns(上一步, {{"學號", each Text.Combine(List.Transform(Text.ToList(_),
    each let c = Character.ToNumber(_) in
    if c >= 65296 and c <= 65305 then Character.FromNumber(c - 65248) else _)), type text}}),
只留數字 = Table.TransformColumns(半形, {{"學號", each Text.Select(_, {"0".."9"}), type text}}),
檢查碼數 = Table.AddColumn(只留數字, "學號正確", each Text.Length([學號]) = 6, type logical)`,
  },
  cls: {
    label: "各系統的班級寫法",
    sample: "301\n高三1班\n三年二班\n3年3班\n高三4班\n三年五班\n3年1班\n302",
    cols: ["原始", "標準班級", "來源推測"],
    run: (s) => {
      const t = s.trim(), CN = "一二三四五六七八九";
      let m;
      if ((m = t.match(/^3(\d{2})$/))) return [s, t, "系統A（名冊）"];
      if ((m = t.match(/^高三(\d)班$/))) return [s, "30" + m[1], "系統B（段考）"];
      if ((m = t.match(/^三年(.)班$/))) return [s, "30" + (CN.indexOf(m[1]) + 1), "系統C（出缺席）"];
      if ((m = t.match(/^3年(\d)班$/))) return [s, "30" + m[1], "系統D（學習歷程）"];
      return [s, "", "對照表裡沒有"];
    },
    note: "原則：班級一律以名冊為準，其他系統的班級欄只拿來核對。實務上不寫規則，而是做一張「班級對照表」，用合併查詢對過去——新增一種寫法時只要加一列。",
    m: `// 對照表.xlsx ▸ 班級對照：標準班級｜班群｜系統A寫法｜系統B寫法｜系統C寫法｜系統D寫法
合併班級 = Table.NestedJoin(出缺席, {"班級"}, 班級對照, {"系統C寫法"}, "對照", JoinKind.LeftOuter),
展開 = Table.ExpandTableColumn(合併班級, "對照", {"標準班級", "班群"})`,
  },
};
document.addEventListener("DOMContentLoaded", () => {
  let cur = "date";
  function run() {
    const T = TOOLS[cur];
    const lines = W.$("#input").value.split(/\r?\n/).filter((x) => x.length);
    const rows = lines.map(T.run);
    W.table(W.$("#out"), T.cols, rows, { cellClass: (i, j, v, row) => (j === T.cols.length - 1 && /打錯|看不懂|沒有/.test(row[j]) ? "m m-absent" : j === 1 && row[1] !== row[0] ? "changed" : "") });
    const bad = rows.filter((r) => /打錯|看不懂|沒有/.test(r[r.length - 1])).length;
    W.$("#sum").innerHTML = `${rows.length} 筆，<span style="color:var(--orange);font-weight:700">${bad} 筆需人工確認</span>`;
    W._out = rows;
  }
  function setTool(t) {
    cur = t; const T = TOOLS[t];
    W.$$("#tabs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.t === t ? "true" : "false"));
    W.$("#inLabel").textContent = T.label; W.$("#input").value = T.sample; W.$("#mcode").textContent = T.m; W.$("#mNote").textContent = T.note;
    run();
  }
  W.$$("#tabs button").forEach((b) => (b.onclick = () => setTool(b.dataset.t)));
  W.$("#input").addEventListener("input", run);
  W.$("#sample").onclick = () => { W.$("#input").value = TOOLS[cur].sample; run(); };
  W.$("#copyOut").onclick = () => W.copy([TOOLS[cur].cols.join("\t")].concat(W._out.map((r) => r.join("\t"))).join("\n"), "已複製，可直接貼到 Excel");
  W.$("#copyM").onclick = () => W.copy(TOOLS[cur].m, "已複製 M 公式");
  setTool("date");
});
</script>
</body>
</html>
