<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校務研究儀表板（範例）</title>
<style>
  :root{
    --ink:#0D1521; --ink2:#1A2939; --ink3:#2A3F56;
    --paper:#F4F6F8; --card:#FFFFFF; --line:#DCE3EA;
    --text:#13212F; --mut:#5D7085;
    --amber:#F2A93B; --teal:#3FB0A0; --red:#D9604E; --slate:#2E4A66;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--text);
       font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;}
  header{background:var(--ink);color:#EAF0F6;padding:22px 28px}
  header .kick{font:700 11px/1 ui-monospace,Consolas,monospace;letter-spacing:2px;color:var(--amber)}
  header h1{margin:8px 0 4px;font-size:24px}
  header p{margin:0;font-size:13px;color:#93A8BE}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 28px 40px}
  .bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;
       background:var(--card);border:1px solid var(--line);border-radius:8px;
       padding:12px 16px;margin:18px 0}
  .bar label{font-size:13px;color:var(--mut)}
  select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);
         border-radius:6px;background:#fff;color:var(--text)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
  .kpi .lab{font-size:12px;color:var(--mut);margin-bottom:6px}
  .kpi .val{font:700 30px/1 ui-monospace,Consolas,monospace}
  .kpi .sub{font-size:11px;color:var(--mut);margin-top:6px}
  h2{font-size:16px;margin:28px 0 10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:880px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
  .panel h3{margin:0 0 12px;font-size:14px;color:var(--slate)}
  .row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .row .nm{width:96px;flex:none;color:var(--mut)}
  .track{display:block;flex:1;background:#EDF1F5;border-radius:4px;height:20px;position:relative;overflow:hidden}
  .fill{display:block;height:100%;min-width:2px;background:var(--slate);border-radius:4px}
  .fill.warn{background:var(--amber)}
  .fill.bad{background:var(--red)}
  .row .v{width:62px;text-align:right;font:700 12px ui-monospace,Consolas,monospace}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left}
  th{background:#F2F5F7;color:var(--slate);font-weight:700}
  td.n{text-align:right;font-family:ui-monospace,Consolas,monospace}
  .up{color:#1F6B5C;font-weight:700}.dn{color:#A8402F;font-weight:700}
  footer{color:var(--mut);font-size:11.5px;margin-top:26px;line-height:1.7;
         border-top:1px solid var(--line);padding-top:14px}
  .note{background:#FDF3E0;border:1px solid #E8C98A;color:#6B4A10;
        border-radius:8px;padding:12px 16px;font-size:12.5px;margin-top:16px}
</style>
</head>
<body>
<header>
  <div class="kick">INSTITUTIONAL RESEARCH &middot; DEMO</div>
  <h1>校務研究儀表板（範例）</h1>
  <p>單一 HTML 檔　&middot;　雙擊即可開啟　&middot;　不需網路、不需伺服器、資料不離開這台電腦</p>
</header>
<div class="wrap">

  <div class="bar">
    <label for="trk">班群</label>
    <select id="trk"><option value="">全部</option></select>
    <label for="grp">入學成績分組</label>
    <select id="grp"><option value="">全部</option></select>
    <span id="cnt" style="font-size:12.5px;color:var(--mut)"></span>
  </div>

  <div class="kpis" id="kpis"></div>

  <h2>學習歷程上傳率</h2>
  <div class="grid">
    <div class="panel"><h3>依入學成績分組</h3><div id="byGrp"></div></div>
    <div class="panel"><h3>依班級</h3><div id="byCls"></div></div>
  </div>

  <h2>多元選修課程</h2>
  <div class="panel"><div id="courses"></div></div>

  <h2>計畫經費與指標變化</h2>
  <div class="panel"><div id="plans"></div></div>

  <div class="note" id="foot"></div>

  <footer>
    這個頁面是研習中用一段提示詞請 AI 產生的範例，資料為模擬資料。<br>
    真實使用時：只把<strong>欄位結構</strong>交給 AI，學生資料留在自己的電腦上，由你貼進檔案裡。
  </footer>
</div>

const $ = s => document.querySelector(s);
const uniq = a => [...new Set(a)].sort();

const byId = {};
DATA.S.forEach(s => byId[s.id] = s);
const portById = {};
DATA.P.forEach(p => portById[p.id] = p);
const hoursById = {};
DATA.H.forEach(h => hoursById[h.id] = h.h);

uniq(DATA.S.map(s => s.trk)).forEach(v => $('#trk').add(new Option(v, v)));
uniq(DATA.S.map(s => s.grp)).forEach(v => $('#grp').add(new Option(v + ' 組', v)));

function pct(a, b){ return b ? (a / b * 100) : 0; }
function fmt(n, d){ return n.toFixed(d === undefined ? 1 : d); }
function money(n){ return (n / 10000).toFixed(0) + ' 萬'; }

function bars(el, items, opts){
  const max = Math.max(...items.map(i => i.v), 1);
  el.innerHTML = items.map(i => {
    const w = (i.v / max * 100).toFixed(1);
    const cls = i.v < (opts && opts.bad !== undefined ? opts.bad : -1) ? 'bad'
              : (i.hi ? 'warn' : '');
    return `<div class="row"><span class="nm">${i.k}</span>
      <span class="track"><span class="fill ${cls}" style="width:${w}%"></span></span>
      <span class="v">${i.t}</span></div>`;
  }).join('');
}

function render(){
  const ft = $('#trk').value, fg = $('#grp').value;
  const sel = DATA.S.filter(s => (!ft || s.trk === ft) && (!fg || s.grp === fg));
  const ids = new Set(sel.map(s => s.id));
  $('#cnt').textContent = `符合條件 ${sel.length} 位學生`;

  // KPI
  let req = 0, act = 0;
  sel.forEach(s => { const p = portById[s.id]; if (p){ req += p.req; act += p.act; } });
  const overall = pct(act, req);
  const cGrp = sel.filter(s => s.grp === 'C');
  let cr = 0, ca = 0;
  cGrp.forEach(s => { const p = portById[s.id]; if (p){ cr += p.req; ca += p.act; } });
  const noPlan = sel.filter(s => !hoursById[s.id]).length;
  const totalAmt = DATA.PL.reduce((a, p) => a + p.amt, 0);

  $('#kpis').innerHTML = [
    ['學習歷程上傳率', fmt(overall) + '%', `應上傳 ${req} 件，實際 ${act} 件`],
    ['C 組上傳率', cGrp.length ? fmt(pct(ca, cr)) + '%' : '—', `C 組 ${cGrp.length} 人`],
    ['未參與任何計畫', noPlan + ' 人', `占 ${fmt(pct(noPlan, sel.length))}%`],
    ['計畫核定經費', money(totalAmt), `${DATA.PL.length} 個計畫`],
  ].map(k => `<div class="kpi"><div class="lab">${k[0]}</div>
      <div class="val">${k[1]}</div><div class="sub">${k[2]}</div></div>`).join('');

  // 依分組
  const gs = {};
  sel.forEach(s => { const p = portById[s.id]; if(!p) return;
    (gs[s.grp] = gs[s.grp] || [0,0]); gs[s.grp][0]+=p.req; gs[s.grp][1]+=p.act; });
  bars($('#byGrp'), Object.keys(gs).sort().map(g => {
    const v = pct(gs[g][1], gs[g][0]);
    return { k: g + ' 組', v, t: fmt(v) + '%', hi: v < 70 };
  }), { });

  // 依班級
  const cs = {};
  sel.forEach(s => { const p = portById[s.id]; if(!p) return;
    (cs[s.cls] = cs[s.cls] || [0,0]); cs[s.cls][0]+=p.req; cs[s.cls][1]+=p.act; });
  bars($('#byCls'), Object.keys(cs).sort().map(c => {
    const v = pct(cs[c][1], cs[c][0]);
    return { k: c + ' 班', v, t: fmt(v) + '%', hi: v < 78 };
  }), { });

  // 課程
  const cm = {};
  DATA.E.forEach(e => { if(!ids.has(e.id)) return;
    const o = cm[e.c] = cm[e.c] || { n:0, abs:0, sat:0, slot:e.slot };
    o.n++; o.abs += e.abs; o.sat += e.sat; });
  const list = Object.entries(cm).sort((a,b) => b[1].n - a[1].n);
  $('#courses').innerHTML = list.length ? `<table><tr>
      <th>課程名稱</th><th>開課時段</th><th style="text-align:right">修課人次</th>
      <th style="text-align:right">平均缺席</th><th style="text-align:right">平均滿意度</th></tr>` +
    list.map(([k,o]) => {
      const ab = o.abs/o.n, sa = o.sat/o.n;
      return `<tr><td>${k}</td><td>${o.slot}</td><td class="n">${o.n}</td>
        <td class="n ${ab>3?'dn':''}">${fmt(ab)}</td>
        <td class="n ${sa<3.5?'dn':''}">${fmt(sa,2)}</td></tr>`;
    }).join('') + '</table>' : '<p style="color:var(--mut);font-size:13px">沒有符合條件的資料</p>';

  // 計畫 vs 指標
  const inv = {};
  DATA.PL.forEach(p => inv[p.ind] = (inv[p.ind]||0) + p.amt);
  $('#plans').innerHTML = `<table><tr>
      <th>指標</th><th style="text-align:right">投入經費</th>
      <th style="text-align:right">110 基線</th><th style="text-align:right">112 學年</th>
      <th style="text-align:right">目標</th><th style="text-align:right">變化</th></tr>` +
    DATA.IN.map(i => {
      const d = i.y112 - i.base;
      const cls = d > 0 ? 'up' : 'dn';
      const amt = inv[i.id] || 0;
      return `<tr><td>${i.name}</td><td class="n">${amt ? money(amt) : '0 元'}</td>
        <td class="n">${i.base}</td><td class="n">${i.y112}</td><td class="n">${i.tgt}</td>
        <td class="n ${cls}">${d>0?'+':''}${fmt(d, Number.isInteger(d)?0:1)}</td></tr>`;
    }).join('') + '</table>';

  $('#foot').textContent =
    '上方篩選只影響學生相關的數字；計畫與指標為全校層級，不隨篩選改變。'
    + '這是刻意的設計 —— 指標是全校共用的，不該被切分。';
}

$('#trk').onchange = render;
$('#grp').onchange = render;
render();
</script>
